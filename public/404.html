<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sayfa Bulunamadı — NÛR STÜDYO</title>
    <meta name="description" content="Aradığınız sayfa bulunamadı — Nûr Stüdyo ana sayfasına dönün." />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #0c0d12;
        color: #f5dda6;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
      }
      .kart {
        max-width: 460px;
        padding: 44px 32px;
        border-radius: 24px;
        border: 1px solid rgba(215,170,82,.35);
        background: rgba(255,255,255,.03);
      }
      .kod {
        font-size: 64px; font-weight: 900; letter-spacing: 4px;
        background: linear-gradient(135deg, #f5dda6, #d7aa52);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        line-height: 1.1;
      }
      .baslik { margin-top: 10px; font-size: 18px; font-weight: 800; color: #fff; }
      .aciklama { margin-top: 8px; font-size: 13px; line-height: 1.7; color: rgba(255,255,255,.55); }
      .cta {
        display: inline-block; margin-top: 22px;
        padding: 12px 28px; border-radius: 14px;
        background: linear-gradient(135deg, #f5dda6, #d7aa52);
        color: #000; font-size: 13px; font-weight: 900; text-decoration: none;
      }
      .yil { margin-top: 18px; font-size: 10px; color: rgba(255,255,255,.3); letter-spacing: 2px; }
    </style>
  </head>
  <body>
    <div class="kart">
      <div class="kod">404</div>
      <div class="baslik">Sayfa bulunamadı</div>
      <p class="aciklama">Aradığınız adres Nûr Stüdyo'da yok — sayfa taşınmış ya da adres yanlış yazılmış olabilir.</p>
      <a class="cta" href="/">🏠 Ana Sayfaya Dön</a>
      <div class="yil">NÛR STÜDYO · İslamî Video Üretici &amp; Kur'an Medya Lab</div>
    </div>
  </body>
</html>
